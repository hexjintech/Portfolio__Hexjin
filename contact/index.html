<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Custom Style -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body data-theme="dark">

    <!-- Navigation -->
    <nav id="navbar" class="fixed-top">
        <div class="container navbar-container">
            <div class="row align-items-center">
                <div class="col-4">
                    <a href="../index.html" class="navbar-logo">
                                                <img src="assets/images/logo.jpeg" alt="logo">

                        HEXJIN<span>TECH</span>
                    </a>
                </div>
                <div class="col-8 d-flex justify-content-end align-items-center">
                    <ul class="navbar-links d-none d-lg-flex mb-0 list-unstyled align-items-center">
                        <li><a href="../index.html" class="navbar-link">Home</a></li>
                        <li><a href="../about/" class="navbar-link">About</a></li>
                        <li><a href="../portfolio/" class="navbar-link">Portfolio</a></li>
                        <li><a href="index.html" class="navbar-link active">Contact</a></li>
                    </ul>
                    <div class="navbar-actions ms-lg-4 d-flex align-items-center gap-3">
                        <button id="theme-toggle" class="btn-theme-toggle border-0 bg-transparent"
                            aria-label="Toggle Theme">
                            <i class="bi bi-sun" id="sun-icon"></i>
                            <i class="bi bi-moon" id="moon-icon" style="display: none;"></i>
                        </button>
                        <button class="navbar-mobile-btn d-lg-none border-0 bg-transparent text-white"
                            aria-label="Menu">
                            <i class="bi bi-list"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main id="app-root">
    <!-- Contact Hero -->
    <section class="hero-section" id="contact-hero">
        <div class="container text-center reveal">
            <span class="hero-badge">Get In Touch</span>
            <h1 class="hero-title">Let's Build Something Great Together</h1>
            <p class="hero-description mx-auto" style="max-width: 600px;">Have a project in mind or just want to say hi? We'd love to hear from you. Drop us a message below.</p>
        </div>
    </section>

    <!-- Contact Content -->
    <section class="contact-section pt-0">
        <div class="container">
            <div class="row g-5 align-items-stretch">
                <div class="col-lg-5 reveal">
                    <div class="contact-info-wrapper h-100 p-5">
                        <h2 class="mb-4">Contact Details</h2>
                        <div class="contact-info-list d-flex flex-column gap-4">
                            <a href="mailto:hexjintech@gmail.com" class="contact-info-item d-flex gap-3 text-decoration-none color-inherit">
                                <div class="contact-icon-box"><i class="bi bi-envelope"></i></div>
                                <div>
                                    <h4 class="mb-1">Email</h4>
                                    <p class="opacity-75 mb-0">hexjintech@gmail.com</p>
                                </div>
                            </a>
                            <a href="https://wa.me/919344230593" target="_blank" class="contact-info-item d-flex gap-3 text-decoration-none color-inherit">
                                <div class="contact-icon-box"><i class="bi bi-telephone"></i></div>
                                <div>
                                    <h4 class="mb-1">Phone / WhatsApp</h4>
                                    <p class="opacity-75 mb-0">+91 93442 30593</p>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="col-lg-7 reveal">
                    <form class="contact-form p-5" action="https://formspree.io/f/xgorkaja" method="POST">
                        <div class="mb-3 contact-form-group">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
                        </div>
                        <div class="mb-3 contact-form-group">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
                        </div>
                        <div class="mb-4 contact-form-group">
                            <label for="message" class="form-label">Message</label>
                            <textarea id="message" name="message" class="form-control" rows="6" placeholder="Tell us about your project..." required></textarea>
                        </div>
                        <button type="submit" class="btn-contact-submit w-100 border-0">Send Message <i class="bi bi-send ms-2"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </section>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/footer.js"></script>
</body>

</html>
